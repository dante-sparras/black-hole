<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Black Hole Simulation</title>
</head>

<body>
  <div id="hud" class="hud">
    <header class="hud-header">
      <div class="hud-title-row">
        <strong>black-hole</strong>
        <button
          type="button"
          id="hud-toggle"
          class="hud-toggle"
          aria-expanded="true"
          aria-controls="hud-body"
          title="Show or hide controls"
        >
          Panels
        </button>
      </div>
      <span id="stats">… fps · med</span>
    </header>
    <div id="hud-body" class="hud-body">
      <div id="controls" class="controls"></div>

      <section class="hud-readouts" aria-label="Derived science readouts">
        <button
          type="button"
          id="readouts-toggle"
          class="section-toggle"
          aria-expanded="false"
          aria-controls="readouts-body"
        >
          <span class="section-toggle-label">Readouts</span>
          <span class="section-toggle-chevron" aria-hidden="true">▸</span>
        </button>
        <div id="readouts-body" class="readouts-body" hidden>
          <dl id="derived" class="derived"></dl>
        </div>
      </section>

      <section class="debug-section" aria-label="Debug tools">
        <label class="ctrl debug-master-row" for="dbg-master">
          <span class="ctrl-label">
            <span class="ctrl-name">Debug mode</span>
          </span>
          <input type="checkbox" id="dbg-master" />
          <span class="ctrl-val" id="dbg-master-val">off</span>
        </label>
        <div id="debug-panel" class="controls debug-panel" hidden></div>
      </section>
    </div>
  </div>
  <div id="error"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
